name: Deploy to GitHub Pages

# Actions are pinned to commit SHAs, not tags: a mutable tag can be repointed at
# malicious code. Tag comments are for humans — a bare SHA is un-auditable.
# Versions resolved and verified node24 on 2026-09-22. Node 20 is removed from
# runners on 2026-09-23, so anything on node20 breaks. Dependabot bumps these.

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one deployment at a time, but never cancel one mid-flight — a cancelled
# Pages deploy can strand the github-pages environment in a pending state.
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # enablement:true provisions Pages from the workflow itself, so no one has
      # to remember Settings -> Pages -> Source. Without Pages enabled this step
      # hard-fails rather than silently publishing nothing.
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: true

      # path MUST be set: this action defaults to `_site`, but Vite emits `dist`.
      # Leaving the default uploads an empty artifact and deploys a blank site.
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
